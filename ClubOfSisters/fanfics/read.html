<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Чтение фанфика · Клуб сестёр</title>
  <style>
    :root {
      --bg: #0e1018;
      --text: #e8ecf5;
      --muted: #9aa3b8;
      --accent: #d4b56a;
      --speaker: #c9a24a;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Georgia, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    .wrap { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    a { color: var(--accent); }
    h1 { font-size: 1.45rem; margin: 0.5rem 0 0.25rem; }
    .meta { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.5rem; }
    .line { margin: 0 0 1rem; }
    .speaker { color: var(--speaker); font-weight: 700; }
    .err { color: #e88; }
    pre.raw {
      white-space: pre-wrap;
      font-family: inherit;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="./">← Все фанфики</a></p>
    <h1 id="title">…</h1>
    <div class="meta" id="meta"></div>
    <article id="body"><p class="meta">Загрузка…</p></article>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id") || "";
    const CATALOG = "../stories/fanfic_catalog.json";

    async function main() {
      const titleEl = document.getElementById("title");
      const metaEl = document.getElementById("meta");
      const bodyEl = document.getElementById("body");
      if (!id) {
        bodyEl.innerHTML = '<p class="err">Не указан id фанфика.</p>';
        return;
      }
      let entry = null;
      try {
        const cat = await (await fetch(CATALOG + "?t=" + Date.now())).json();
        entry = (cat.entries || []).find(e => e && (e.fanficId === id || e.resourceFileName === "ugc/" + id));
      } catch (_) {}

      titleEl.textContent = (entry && entry.title) || id;
      metaEl.textContent = entry
        ? `к «${entry.parentTitle || entry.parentNovelId || "?"}» · ${entry.author || "Игрок"}`
        : "";

      const txtUrl = `../content/ugc/${encodeURIComponent(id)}/readable.txt`;
      const yarnUrl = (entry && entry.fanficYarnUrl)
        || `../content/ugc/${encodeURIComponent(id)}/continuation.yarn`;

      try {
        let res = await fetch(txtUrl + "?t=" + Date.now());
        if (res.ok) {
          const text = await res.text();
          bodyEl.innerHTML = renderReadable(text);
          return;
        }
        res = await fetch(yarnUrl + (yarnUrl.startsWith("http") ? "" : "?t=" + Date.now()));
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        bodyEl.innerHTML = renderYarn(await res.text());
      } catch (err) {
        bodyEl.innerHTML = `<p class="err">Не удалось загрузить текст: ${escapeHtml(String(err))}</p>`;
      }
    }

    function renderReadable(text) {
      return `<pre class="raw">${escapeHtml(text)}</pre>`;
    }

    function renderYarn(yarn) {
      const lines = [];
      for (const raw of yarn.replace(/\r\n/g, "\n").split("\n")) {
        const t = raw.trim();
        if (!t || t.startsWith("//") || t.startsWith("<<") || t.startsWith("---") ||
            t.startsWith("===") || /^title:/i.test(t) || /^tags:/i.test(t) || t.startsWith("->"))
          continue;
        const i = t.indexOf(":");
        if (i <= 0 || i > 40) continue;
        const sp = t.slice(0, i).trim();
        const tx = t.slice(i + 1).trim();
        if (!sp || !tx || sp.includes(" ")) continue;
        lines.push(`<p class="line"><span class="speaker">${escapeHtml(sp)}:</span> ${escapeHtml(tx)}</p>`);
      }
      return lines.length ? lines.join("") : `<pre class="raw">${escapeHtml(yarn)}</pre>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }
    main();
  </script>
</body>
</html>
