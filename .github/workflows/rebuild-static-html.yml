name: Rebuild static HTML

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "index.md"
      - "projects/*.md"
      - "tools/build_site.py"
      - "assets/css/**"
      - "_includes/**"
      - "_layouts/**"
      - "_config.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install -r tools/requirements.txt
      - name: Build
        run: python3 tools/build_site.py
      - name: Commit HTML if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets 20?? projects
          git diff --cached --quiet && echo "no html changes" && exit 0
          git commit -m "Rebuild static GitHub Pages HTML."
          git push
